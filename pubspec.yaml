  assets:
    - assets/images/
    - assets/images/moov.png
    - assets/images/mtn.jpg
    - assets/images/orange.png
    - assets/images/wave.png
    - assets/images/position.png
    - assets/images/pc_logo.png
    - assets/images/assurance.jpeg
    - assets/images/medicament.jpg
    - assets/images/pharmacy.jpg
    - assets/intro/
    - assets/json/logo.json
    - assets/json/logov.json
    - assets/json/ratings.json
    - assets/icons/
    - assets/icons/icon.png
    - assets/pub/
    - assets/svg/
    - assets/svg/pharmacy.svg
    - assets/sounds/beep.mp3