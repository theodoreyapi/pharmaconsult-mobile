dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  gap: ^3.0.1
  sizer: ^3.0.5
  pinput: ^5.0.1
  intl_phone_number_input:
    git:
      url: https://github.com/Shahidbangash/intl_phone_number_input.git
      ref: develop
  shared_preferences: ^2.5.2
  awesome_snackbar_content: ^0.1.5
  image_picker: ^1.1.2
  permission_handler: ^11.4.0
  qr_flutter: ^4.1.0
  qr_code_scanner_plus: ^2.0.10+1
  flutter_contacts: ^1.1.9+2
  lottie: ^3.3.1
  flutter_rating: ^2.0.2
  modal_bottom_sheet: ^3.0.0
  http: ^1.3.0
  intl: ^0.20.2
  connectivity_plus: ^6.1.4
  url_launcher: ^6.3.1
  flutter_localization: ^0.3.2
  flutter_typeahead: ^5.2.0
  rating_summary: ^1.0.4
  flutter_html: ^3.0.0
  cinetpay: ^1.0.8
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.6
  package_info_plus: ^8.3.0
  flutter_svg: ^2.1.0
  share_plus: ^11.1.0
  encrypt: ^5.0.3
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4
  webview_flutter: ^4.13.0
  audioplayers: ^6.5.1
  syncfusion_flutter_pdf: ^33.2.12
  syncfusion_flutter_pdfviewer: ^33.1.44
  path_provider: ^2.1.5
  screenshot: ^3.0.0
  gal: ^2.3.1
  flutter_local_notifications: ^21.0.0
  app_links: ^7.0.0
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

